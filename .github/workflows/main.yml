name: Compilar Nebula (Mac y Windows)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Leer version
        id: ver
        run: |
          V=$(grep -Eo 'project\(NebulaSynth VERSION [0-9.]+' CMakeLists.txt | awk '{print $3}')
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "Version: ${V}"

      - name: Configurar (descarga JUCE)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DNEBULA_BUILD_TESTS=ON

      - name: Compilar VST3, AU y app (Apple Silicon + Intel)
        run: cmake --build build --config Release --target NebulaSynth_VST3 NebulaSynth_AU NebulaSynth_Standalone

      - name: Compilar pruebas (un solo ejecutable)
        run: |
          set -o pipefail
          cmake --build build --config Release --target NebulaTests 2>&1 | tee build-tests.log || {
            # los errores se publican como anotaciones (se ven en la página del CI y por la API)
            grep -E "error:" build-tests.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Pruebas de motor y estabilidad
        run: |
          T=./build/NebulaTests_artefacts/Release/NebulaTests
          mkdir -p test-output
          fallos=0
          run() {
            # cada prueba deja su salida en test-output; las líneas FALLO se publican como anotaciones
            local name="$1"; shift
            "$T" "$name" "$@" > "test-output/$name.log" 2>&1
            local rc=$?
            cat "test-output/$name.log"
            if [ $rc -ne 0 ]; then
              fallos=$((fallos+1))
              echo "::error title=$name::la prueba termino con codigo $rc"
              grep -E "FALLO" "test-output/$name.log" | head -20 | while IFS= read -r l; do echo "::error title=$name::$l"; done
            else
              echo "::notice title=$name::$(tail -1 "test-output/$name.log")"
            fi
          }
          set +e
          run Ui test-output/ui
          run Stereo
          run Determinism tests/fixtures/v3
          run V3 test-output/v3
          run Midi
          run Dna
          run Transform
          run Forge
          run ForgeDb
          run Genome
          run Render test-output/render
          run V21 test-output/v21
          run V2 test-output/v2
          if [ "$fallos" -gt 0 ]; then echo "::error::$fallos pruebas fallaron"; exit 1; fi

      - name: Compatibilidad con proyectos v3 (informativa en Mac)
        continue-on-error: true
        run: |
          ./build/NebulaTests_artefacts/Release/NebulaTests Bench test-output/bench --only 0,8 --fixtures tests/fixtures/v3 2>&1 | tee bench.log
          grep "Compatibilidad" bench.log | while IFS= read -r l; do echo "::notice title=Compatibilidad::$l"; done

      - name: Subir resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nebula-Pruebas
          path: test-output
          retention-days: 14

      - name: Firmar localmente (ad-hoc)
        run: |
          A=build/NebulaSynth_artefacts/Release
          codesign --force --deep --sign - "$A/VST3/Nebula.vst3"
          codesign --force --deep --sign - "$A/AU/Nebula.component"
          codesign --force --deep --sign - "$A/Standalone/Nebula.app"
          lipo -info "$A/VST3/Nebula.vst3/Contents/MacOS/Nebula"

      - name: Validar el Audio Unit (auval)
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/NebulaSynth_artefacts/Release/AU/Nebula.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 2
          # el resultado queda como anotación (se puede leer por la API aunque los registros no se descarguen)
          if auval -v aumu Nbl1 Rmcd > auval.log 2>&1 && grep -q "AU VALIDATION SUCCEEDED" auval.log; then
            echo "::notice title=auval::AU VALIDATION SUCCEEDED"
          else
            grep -iE "error|fail" auval.log | head -10 | while IFS= read -r l; do echo "::warning title=auval::$l"; done
            echo "::warning title=auval::auval no aprobo el AU"
          fi
          tail -5 auval.log

      - name: pluginval (VST3 y AU)
        continue-on-error: true
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q -o pluginval.zip -d pluginval
          PV=pluginval/pluginval.app/Contents/MacOS/pluginval
          A=build/NebulaSynth_artefacts/Release
          for f in "VST3/Nebula.vst3" "AU/Nebula.component"; do
            n=$(basename "$f")
            if "$PV" --strictness-level 5 --validate-in-process --timeout-ms 600000 --validate "$A/$f" > "pluginval-$n.log" 2>&1; then
              echo "::notice title=pluginval $n::pluginval nivel 5 aprobado"
            else
              grep -E "FAILED|\*\*\*|Error" "pluginval-$n.log" | head -10 | while IFS= read -r l; do echo "::warning title=pluginval $n::$l"; done
              echo "::warning title=pluginval $n::pluginval nivel 5 NO aprobado"
            fi
            tail -5 "pluginval-$n.log"
          done

      - name: Crear instalador .pkg
        run: |
          chmod +x packaging/make_installer.sh
          packaging/make_installer.sh "${{ steps.ver.outputs.version }}"

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: Nebula-Instalador-${{ steps.ver.outputs.version }}
          path: dist/*.pkg
          retention-days: 30

  windows:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar (descarga JUCE)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DNEBULA_BUILD_TESTS=ON

      - name: Compilar VST3 y app
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 4 --target NebulaSynth_VST3 NebulaSynth_Standalone 2>&1 | tee build-plugin.log || {
            grep -E "error C|error LNK|: error" build-plugin.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Compilar pruebas
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 4 --target NebulaTests 2>&1 | tee build-tests.log || {
            grep -E "error C|error LNK|: error" build-tests.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Pruebas de motor y estabilidad (Windows)
        shell: bash
        run: |
          T=./build/NebulaTests_artefacts/Release/NebulaTests.exe
          mkdir -p test-output
          fallos=0
          run() {
            local name="$1"; shift
            "$T" "$name" "$@" > "test-output/$name.log" 2>&1
            local rc=$?
            cat "test-output/$name.log"
            if [ $rc -ne 0 ]; then
              fallos=$((fallos+1))
              echo "::error title=Windows $name::la prueba termino con codigo $rc"
              grep -E "FALLO" "test-output/$name.log" | head -20 | while IFS= read -r l; do echo "::error title=Windows $name::$l"; done
            else
              echo "::notice title=Windows $name::$(tail -1 "test-output/$name.log")"
            fi
          }
          set +e
          run Stereo
          run Determinism tests/fixtures/v3
          run Midi
          run Dna
          run Transform
          run Forge
          run ForgeDb
          run Genome
          run Ui test-output/ui
          if [ "$fallos" -gt 0 ]; then echo "::error::$fallos pruebas fallaron en Windows"; exit 1; fi

      - name: pluginval (VST3, Windows)
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive -Path pluginval.zip -DestinationPath pluginval -Force
          $vst = "build\NebulaSynth_artefacts\Release\VST3\Nebula.vst3"
          $p = Start-Process -FilePath "pluginval\pluginval.exe" -ArgumentList "--strictness-level 5 --validate-in-process --timeout-ms 600000 --validate `"$vst`"" -NoNewWindow -Wait -PassThru -RedirectStandardOutput pluginval-win.log
          Get-Content pluginval-win.log -Tail 8
          if ($p.ExitCode -eq 0) { Write-Output "::notice title=pluginval Windows::pluginval nivel 5 aprobado (VST3)" }
          else {
            Select-String -Path pluginval-win.log -Pattern "FAILED|\*\*\*|Error" | Select-Object -First 10 | ForEach-Object { Write-Output "::warning title=pluginval Windows::$($_.Line)" }
            Write-Output "::warning title=pluginval Windows::pluginval nivel 5 NO aprobado (codigo $($p.ExitCode))"
          }

      - name: Subir VST3 de Windows y resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nebula-Windows
          path: |
            build/NebulaSynth_artefacts/Release/VST3
            test-output
            pluginval-win.log
          retention-days: 14
